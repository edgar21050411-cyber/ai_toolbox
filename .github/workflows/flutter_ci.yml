name: Flutter Cloud CI & APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Flutter Analyze, Test & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter & Environment
        run: |
          flutter --version
          dart --version
          java -version

      - name: Scaffold Android Platform if Missing
        working-directory: mobile
        run: |
          if [ ! -d "android" ]; then
            echo "Scaffolding Android platform files..."
            flutter create . --platforms=android --org=com.aitoolbox
            git checkout test/widget_test.dart 2>/dev/null || true
          fi

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze_output.log
          ANALYZE_EXIT=${PIPESTATUS[0]}
          echo "### Flutter Analyze Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat analyze_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "::warning title=analyze::$line"
            fi
          done < analyze_output.log
          exit $ANALYZE_EXIT

      - name: Upload Analyze Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-output
          path: mobile/analyze_output.log

      - name: Run Flutter Tests
        working-directory: mobile
        run: flutter test

      - name: Build Debug APK
        working-directory: mobile
        run: |
          flutter build apk --debug \
            --dart-define=ENVIRONMENT=production \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-toolbox-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
