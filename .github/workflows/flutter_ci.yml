name: Flutter Cloud CI & APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Flutter Analyze, Test & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter & Environment
        run: |
          flutter --version
          dart --version
          java -version

      - name: Scaffold Android Platform if Missing
        working-directory: mobile
        run: |
          if [ ! -d "android" ]; then
            echo "Scaffolding Android platform files..."
            flutter create . --platforms=android --org=com.aitoolbox
            git checkout test/widget_test.dart 2>/dev/null || true
          fi

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter Tests
        working-directory: mobile
        run: flutter test

      - name: Build Debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-toolbox-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
